[workspace]
members = [
  "crates/ghostnet-adapter-api",
  "crates/ghostnet-cli",
  "crates/ghostnet-doctrine",
  "crates/ghostnet-store",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
